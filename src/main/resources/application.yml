spring:
  application:
    name: stock-reading

  # .env 를 설정값으로 읽어들임. 파일이 없어도 기동은 되도록 optional
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/stock_reading
    username: stock_reading
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 스키마는 Flyway 가 관리한다. JPA 는 검증만 하고 손대지 않음
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # DB · Redis 연결 상태까지 보이도록
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
