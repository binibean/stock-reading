spring:
  application:
    name: stock-reading

  # .env 를 설정값으로 읽어들인다.
  # optional: → 파일이 없어도 기동 실패하지 않음 (CI·배포 서버에는 .env 가 없다)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/stock_reading
    username: stock_reading
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 스키마는 Flyway 가 관리한다. JPA 는 검증만 하고 손대지 않는다.
      ddl-auto: validate
    # 기본값 true. 켜두면 응답이 끝날 때까지 DB 커넥션을 붙잡아 풀이 고갈된다.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      # 기본은 표준 포트. 다른 프로젝트와 겹치는 PC 에서만 .env 의 REDIS_PORT 로 바꾼다.
      port: ${REDIS_PORT:6379}

  # 이 API 는 JSON 만 받는다. 아래 두 기능은 컨트롤러보다 먼저 요청 본문을 해석해서,
  # 깨진 폼·multipart 요청을 400 이 아닌 500 으로 만든다.
  # 업로드 API 가 생기면 multipart 를 켜고 MultipartException 을 400 으로 처리한다.
  mvc:
    formcontent:
      filter:
        enabled: false
  servlet:
    multipart:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # DB · Redis 연결 상태까지 보이게 한다
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html